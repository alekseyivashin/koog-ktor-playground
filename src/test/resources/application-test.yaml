service:
  name: ktor-koog-playground-test
  version: 0.0.1-test

database:
  host: localhost
  port: 5432
  name: testdb
  user: postgres
  password: postgres
  jdbcPool:
    minIdleSize: 0
    maxPoolSize: 5
  r2dbcPool:
    minIdleSize: 0
    maxPoolSize: 5

agents:
  api:
    geminiApiKey: test-gemini-key
  mcp:
    tavilyApiKey: test-tavily-key
  optimizer:
    retry:
      maxAttempts: 1
      initialDelaySeconds: 1
      maxDelaySeconds: 1
      backoffMultiplier: 1.0
  telemetry:
    verbose: false
    console:
      enabled: false
    jaeger:
      enabled: false
      endpoint: http://localhost:4317
