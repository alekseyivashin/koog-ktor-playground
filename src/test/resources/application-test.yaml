service:
  name: ktor-koog-playground-test
  version: 0.0.1-test

ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.aivashin.configuration.AgentModuleKt.agentModule

database:
  url: jdbc:h2:mem:webfacingtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
  user: sa
  password: ""

agents:
  api:
    geminiApiKey: test-gemini-key
  mcp:
    tavilyApiKey: test-tavily-key
  optimizer:
    retry:
      maxAttempts: 1
      initialDelaySeconds: 1
      maxDelaySeconds: 1
      backoffMultiplier: 1.0
  telemetry:
    verbose: false
    console:
      enabled: false
    jaeger:
      enabled: false
      endpoint: http://localhost:4317
