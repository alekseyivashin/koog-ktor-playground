ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.aivashin.configuration.AgentModuleKt.agentModule

database:
  url: jdbc:postgresql://localhost:5432/ktor-koog-playground
  user: postgres
  password: postgres

agents:
  api:
    geminiApiKey: $GEMINI_API_KEY
  mcp:
    tavilyApiKey: $TAVILY_API_KEY
  optimizer:
    retry:
      maxAttempts: 5
      initialDelaySeconds: 1
      maxDelaySeconds: 30
      backoffMultiplier: 2.0

