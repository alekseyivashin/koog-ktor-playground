service:
  name: ktor-koog-playground
  version: 0.0.1

ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.aivashin.configuration.AgentModuleKt.agentModule

database:
  host: localhost
  port: 5432
  name: ktor-koog-playground
  user: postgres
  password: postgres
  jdbcPool:
    minIdleSize: 1
    maxPoolSize: 10
  r2dbcPool:
    minIdleSize: 1
    maxPoolSize: 10

agents:
  api:
    geminiApiKey: $GEMINI_API_KEY
  mcp:
    tavilyApiKey: $TAVILY_API_KEY
  optimizer:
    retry:
      maxAttempts: 5
      initialDelaySeconds: 1
      maxDelaySeconds: 30
      backoffMultiplier: 2.0
  telemetry:
    verbose: true
    console:
      enabled: true
    jaeger:
      enabled: true
      endpoint: http://localhost:4317
